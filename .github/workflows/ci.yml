# One pipeline for every change:
# - checks: on every pull request and every push to master - lint, formatting, types, unit tests, the
#   production build, the Storybook build and the Playwright E2E suite. The builds are kept as artifacts
#   for the jobs below, so what gets deployed is exactly what was tested.
# - preview: on pull requests only, publishes the app and the Storybook to temporary Firebase preview
#   channels (7 days) and comments their links on the PR.
# - deploy: on pushes to master only, once checks pass, publishes the app and the Storybook live.
name: CI

on:
  pull_request:
  push:
    branches: [master]

# On a PR, a newer push cancels the run still going for the older one; on master every run finishes,
# so a deploy is never cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Check types
        run: bunx tsc -b

      - name: Unit tests
        run: bun run test

      - name: Build the app
        run: bun run build

      - name: Build the Storybook
        run: bun run build-storybook

      - name: Install the Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: E2E tests
        run: bun run e2e

      - name: Keep the E2E report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Keep the app build
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist/
          retention-days: 7

      - name: Keep the Storybook build
        uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: storybook-static/
          retention-days: 7

  preview:
    needs: checks
    # Pull requests from forks don't get the Firebase secrets, so they skip the preview.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: storybook
          path: storybook-static/

      - name: Preview the app
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SCHOOL_FLOW_360 }}
          projectId: school-flow-360
          target: app
          expires: 7d

      - name: Preview the Storybook
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SCHOOL_FLOW_360_STORYBOOK }}
          projectId: school-flow-360-storybook
          target: storybook
          expires: 7d

  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Two merges in a row deploy one after the other, never at the same time.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://school-flow-360.web.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: storybook
          path: storybook-static/

      - name: Deploy the app
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SCHOOL_FLOW_360 }}
          projectId: school-flow-360
          target: app
          channelId: live

      - name: Deploy the Storybook
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SCHOOL_FLOW_360_STORYBOOK }}
          projectId: school-flow-360-storybook
          target: storybook
          channelId: live
