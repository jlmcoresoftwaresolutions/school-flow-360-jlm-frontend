# Checks a pull request's title against the same commitlint rules as the commit-msg hook. A squash
# merge turns the title into the commit on master, with " (#<number>)" appended, and no local hook ever
# sees that message - so the title is checked here with the suffix included, keeping the master commit
# within the 72-character limit. It is its own workflow so that editing the title re-runs only this
# check, not the whole CI.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The title goes through an env var, never straight into the script, so it can't inject shell.
      - name: Lint the title as a commit message
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s (#%s)\n' "$PR_TITLE" "$PR_NUMBER" | bunx commitlint --verbose
